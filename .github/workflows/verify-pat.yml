name: Verify PAT

# Manual pre-release check: proves the VSCE_PAT repository secret can publish to
# the `samxxu` Marketplace publisher, without publishing anything.
#
# Run from the CLI:
#   gh workflow run verify-pat.yml -R samxxu/ct-vscode
#   gh run watch -R samxxu/ct-vscode
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify VSCE_PAT can publish to the samxxu publisher
        run: npx vsce verify-pat samxxu -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
