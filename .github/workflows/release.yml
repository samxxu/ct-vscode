name: Release

on:
  push:
    tags:
      - 'v*'

# Trusted Publishing (GitHub OIDC): the Marketplace publisher policy accepts
# this repository + this workflow file, so no PAT secret is involved. Do not
# add a PAT env back — the global Azure DevOps PATs retire on 2026-12-01.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npx @vscode/vsce package -o ct-vscode.vsix

      - name: Upload vsix
        uses: actions/upload-artifact@v4
        with:
          name: ct-vscode-vsix
          path: ct-vscode.vsix
          if-no-files-found: error

      - name: Publish to Visual Studio Marketplace (Trusted Publishing / OIDC)
        run: npx @vscode/vsce publish --oidc --packagePath ct-vscode.vsix
