name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npx vsce package -o ct-vscode.vsix

      - name: Upload vsix
        uses: actions/upload-artifact@v4
        with:
          name: ct-vscode-vsix
          path: ct-vscode.vsix
          if-no-files-found: error

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --packagePath ct-vscode.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
